name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the full test suite (explicit request only)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full suite (explicit request)
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite
        run: npm run check:all
      - name: World-map startup regression
        run: node tools/test-world-map-locomotion.mjs
      - name: Boardwalk mesh regression
        run: node tools/test-wood-path-kit.mjs && node tools/test-wood-path-meshes.mjs && node tools/test-wood-path-level.mjs
      - name: Renderer frame graph regression
        run: npm run check:renderer
      - name: Crate attack targeting regression
        run: node tools/test-crate-hit-forgiveness.mjs && npm run check:crate-jump && npm run check:crate-types
      - name: Touch ownership and responsive layout regression
        run: node tools/test-touch-release.mjs && node tools/test-touch-screen-awake.mjs && node tools/test-jump-cancellation-replay.mjs && node tools/test-mobile-ui-layout.mjs
      - name: Offline cache regression
        run: npm run check:offline
      - name: Enemy presentation and update regression
        run: node tools/test-enemy-catalog.mjs && node tools/test-game-update.mjs && node tools/test-update-game.mjs
      - name: Mobile resource regression
        run: node tools/test-mobile-residency.mjs && node tools/test-idle-rope.mjs && node tools/test-audio-loops.mjs && node tools/test-stability-report.mjs && node tools/test-jungle-cup-ui.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
