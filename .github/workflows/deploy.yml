name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the full test suite (explicit request only)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Finish the active release; GitHub retains only the newest pending run.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full suite (explicit request)
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite
        run: npm run check:all
      # Keep feature-specific regressions local/on demand, outside the publish loop.
      - run: npm run build
      - name: Release size before upload
        run: npm run check:release
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
