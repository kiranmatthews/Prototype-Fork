<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Update game · Codex/sol fork</title>
<style>body{margin:0;background:#101923;color:#f1f5f3;font:18px/1.5 system-ui,sans-serif;display:grid;min-height:100dvh;place-items:center}main{max-width:30rem;padding:32px}h1{font-size:30px}button{padding:14px 22px;border:0;border-radius:8px;background:#ffd36c;color:#182119;font:700 18px system-ui;cursor:pointer}button:disabled{opacity:.6}a{color:#cee1df}#status{min-height:3em;color:#c4d6cf}small{color:#a6b8b1}</style></head>
<body><main><small>Codex/sol fork</small><h1>Open the latest game</h1><p>Update this browser’s copy. Your saved games, settings and custom levels stay on this device.</p><button id="update">Update and open game</button><p id="status" role="status" aria-live="polite">Connect to the internet to update.</p><a href="./">Back to game</a></main>
<script>
const button=document.getElementById('update'),status=document.getElementById('status');
button.onclick=async()=>{
  button.disabled=true;status.textContent='Loading the latest game…';
  try{
    const base=new URL('./',location.href);
    // This page is deliberately absent from every offline manifest. Check a
    // live URL before detaching the old worker, preserving offline fallback
    // if the connection has gone away since the page was opened.
    const check=new URL('update-game.html',base);check.searchParams.set('check',String(Date.now()));
    const response=await fetch(check,{cache:'no-store'});
    if(!response.ok)throw Error('offline');await response.body?.cancel();
    if('serviceWorker' in navigator){
      const registration=await navigator.serviceWorker.getRegistration(base.href);
      if(registration?.scope===base.href)await registration.unregister();
    }
    // Navigation adopts the current release. No saved data or cached files
    // are deleted; the next worker can reuse matching offline asset bytes.
    const target=new URL('./',base),params=new URL(location.href).searchParams;
    const level=params.get('level');if(level&&/^[a-zA-Z0-9_-]+$/.test(level))target.searchParams.set('level',level);
    if(params.has('playtest'))target.searchParams.set('playtest','');
    target.searchParams.set('updated',String(Date.now()));
    location.replace(target.href);
  }catch{
    status.textContent='Could not load the update. Connect to the internet and try again.';button.disabled=false;
  }
};
</script></body></html>
