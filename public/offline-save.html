<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Save offline · Codex/sol fork</title>
<style>body{margin:0;background:#101923;color:#f1f5f3;font:18px/1.5 system-ui,sans-serif;display:grid;min-height:100dvh;place-items:center}main{max-width:30rem;padding:32px}h1{font-size:30px}button,a{display:inline-block;padding:12px 18px;border:0;border-radius:8px;background:#ffd36c;color:#182119;font:700 17px system-ui;cursor:pointer;text-decoration:none}button:disabled{opacity:.6}#status{min-height:4em;color:#c4d6cf}small{color:#a6b8b1}progress{width:100%}</style></head>
<body><main><small>Codex/sol fork</small><h1>Save for offline play</h1><p>Close other game windows, then save here. Keep this screen open until the download finishes. Your saves and settings stay on this device.</p><button id="save">Save offline copy</button><progress id="progress" value="0" max="1"></progress><p id="status" role="status" aria-live="polite">The game is closed while its offline copy downloads.</p><a href="./" id="back">Back to game</a></main>
<script>
const button=document.getElementById('save'),status=document.getElementById('status'),progress=document.getElementById('progress');
let registration;
function show(data){
  if(data?.type!=='solProtoOffline')return;
  progress.max=data.total||1;progress.value=data.completed||0;
  if(data.phase==='ready'){
    status.textContent='Ready for offline play. You can return to the game.';button.disabled=false;
    navigator.storage?.persist?.().catch(()=>{});
  }else if(data.phase==='error'){
    status.textContent=data.reason==='storage'?'Not enough device space. Free some space and try again.':data.reason==='game-open'?'Close every other game window, then try again.':'Download interrupted. Reconnect and try again; completed files will be reused.';button.disabled=false;
  }else status.textContent=`Saving offline copy: ${Math.floor(100*(data.completed||0)/(data.total||1))}%. Keep this screen open.`;
}
function watch(worker){
  if(!worker)return;
  worker.addEventListener('statechange',()=>{
    if(worker.state==='redundant'){status.textContent='Save stopped. Close other game windows, check your connection, then try again.';button.disabled=false;}
    if(worker.state==='installed')status.textContent=registration.waiting?'Copy saved. Close all game windows, including this one, then reopen to use the update.':'Copy saved. Opening offline play is now available.';
  });
}
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',event=>show(event.data));
button.onclick=async()=>{
  button.disabled=true;status.textContent='Preparing offline copy…';
  try{
    registration=await navigator.serviceWorker.register(new URL('sw.js',location.href),{scope:'./',updateViaCache:'none'});
    registration.addEventListener('updatefound',()=>watch(registration.installing));watch(registration.installing);
    (registration.installing||registration.waiting||registration.active)?.postMessage({type:'solProtoOfflineStatus'});
  }catch{status.textContent='Could not start saving. Close other game windows, connect to the internet, then try again.';button.disabled=false;}
};
document.getElementById('back').onclick=event=>{event.preventDefault();location.replace('./');};
</script></body></html>
