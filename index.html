<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Add to Home Screen = true fullscreen: in-tab Safari always owns the
         status bar / Dynamic Island strip in portrait, but the home-screen app
         renders behind it (black-translucent) with safe-area insets set. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Board Proto" />
    <meta name="theme-color" content="#1a1c24" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="data:," />
    <title>Board Platformer Proto</title>
    <style>
      /* touch-action: manipulation kills iOS double-tap-to-zoom everywhere
         while leaving panel scrolling alone (game surfaces opt into 'none') */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1c24; overscroll-behavior: none; touch-action: manipulation; }
      /* sized by main.ts resize(): --vh carries the REAL device height. iOS
         standalone underreports the viewport by the home-indicator strip and
         never paints it (the black bar) — so the page deliberately sizes past
         the viewport to the physical screen edge. */
      html, body, #app { height: var(--vh, 100%); }
      #app { width: 100%; }
      /* image-rendering is set live from main.ts's resize(): pixelated only
         when renderScale drops below 0.7, smooth linear upscale otherwise. */
      #app canvas { width: 100% !important; height: 100% !important; display: block; }
      /* Barely-there scanline texture + gentle vignette over the 3D view,
         under the HUD (z 10+) so text stays crisp. Pure DOM; main.ts skips it
         in ?lite. */
      .crt-overlay {
        position: fixed; inset: 0; z-index: 5; pointer-events: none;
        background:
          repeating-linear-gradient(to bottom, rgba(4, 6, 12, 0.035) 0 1px, transparent 1px 2px),
          radial-gradient(ellipse 120% 120% at 50% 45%, transparent 58%, rgba(4, 6, 12, 0.26) 100%);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
