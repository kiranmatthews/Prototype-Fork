<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Board Platformer Proto</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1c24; }
      #app { width: 100%; height: 100%; }
      #app canvas { width: 100% !important; height: 100% !important; image-rendering: pixelated; display: block; }
      /* CRT dressing: faint scanlines + vignette over the 3D view, under the
         HUD (z 10+) so text stays crisp. Pure DOM; main.ts skips it in ?lite. */
      .crt-overlay {
        position: fixed; inset: 0; z-index: 5; pointer-events: none;
        background:
          repeating-linear-gradient(to bottom, rgba(4, 6, 12, 0.08) 0 1px, transparent 1px 3px),
          radial-gradient(ellipse 120% 120% at 50% 45%, transparent 55%, rgba(4, 6, 12, 0.32) 100%);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
