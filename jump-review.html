<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jump A/B/C playtest</title><style>html,body{margin:0;overflow:hidden}#app{width:100vw;height:100vh}#app canvas{width:100%!important;height:100%!important;display:block}
#jump-ab-panel{position:fixed;left:48px;top:12px;z-index:999999;width:min(360px,calc(100vw - 110px));box-sizing:border-box;background:#101d2aee;color:#f7fbff;padding:12px 14px;border:1px solid #687c8e;border-radius:10px;font:13px/1.4 system-ui;box-shadow:0 8px 24px #0005}
#jump-ab-panel h1{font-size:15px;margin:0 0 9px}#jump-ab-panel p{margin:7px 0;color:#c0cedc}#jump-ab-panel button{padding:7px 10px;margin:3px 4px 3px 0;border:1px solid #718395;border-radius:5px;background:#263b4d;color:white;font:600 12px system-ui;cursor:pointer}
#jump-ab-panel button[aria-pressed=true]{background:#c3f393;color:#142416;border-color:#c3f393}#jump-ab-panel button:focus-visible{outline:2px solid white;outline-offset:2px}#jump-ab-panel details{border-top:1px solid #516170;margin-top:8px;padding-top:8px}#jump-ab-panel summary{cursor:pointer;color:#c0cedc}#jump-ab-panel pre{font:10px/1.3 monospace;white-space:pre-wrap;margin:7px 0 0}#jump-ab-panel [data-testid=jump-ab-current]{font-weight:700;color:#c3f393}#jump-ab-panel small{display:block;color:#aac0d2;margin-top:5px}
</style></head>
