<!doctype html><html><head><title>Haunted asset inspection</title><style>body{margin:0}canvas{display:block}</style></head><body><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';
import {sceneryTextureLoader} from '/src/sceneryTextureLoader.ts';
const name=new URLSearchParams(location.search).get('asset')||'ghost-train-castle';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(1000,800);renderer.setPixelRatio(1);document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#626776');
scene.add(new THREE.HemisphereLight(0xd7def8,0x554e48,2));const light=new THREE.DirectionalLight(0xffe1c9,3);light.position.set(2,4,3);scene.add(light);
const model=(await new GLTFLoader().setKTX2Loader(sceneryTextureLoader(renderer)).loadAsync('/blockworks-art/'+name+'.glb')).scene;scene.add(model);model.updateMatrixWorld(true);
const box=new THREE.Box3().setFromObject(model),centre=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
const camera=new THREE.PerspectiveCamera(45,1.25,.001,50);
const render=(yaw=0)=>{camera.position.copy(centre).add(new THREE.Vector3(Math.sin(yaw)*1.7,.55,Math.cos(yaw)*1.7));camera.lookAt(centre);renderer.render(scene,camera);};
window.assetView={model,box:box.min.toArray().concat(box.max.toArray()),size:size.toArray(),render};render();
</script></body></html>
