<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Roo model font proof</title>
<style>body{margin:0;background:#10121a;color:#dde3ed;font:14px/1.4 system-ui}header{padding:18px 26px}h1{font-size:20px;margin:0 0 6px}p{margin:4px 0;color:#aeb9cc}canvas{display:block;width:min(100%,1440px);height:auto;margin:10px auto}#status{white-space:pre-wrap}button{padding:8px 12px;font:inherit;margin:10px 8px 0 0}</style></head><body><header><h1>Roo image-model font — working proof</h1><p>Every glyph uses a recorded image-model pass. Reference lighting is retained where available.</p><p id="status">Baking…</p><button id="light">Dark / light background</button><button id="size">Native / enlarged</button></header><canvas id="proof"></canvas><script type="module">
import {bakeModelFont} from './model-font.ts';
const result=await bakeModelFont(new URLSearchParams(location.search).has('partial'));window.rooModelFont=result;
const canvas=document.getElementById('proof'),ctx=canvas.getContext('2d');let light=false,large=false;
function line(text,palette,x,y,size,tracking=0){const a=result.atlases[palette],m=a.metrics;let pen=x;for(const c of text){const g=m.glyphs[c];if(!g){ctx.fillStyle='#f55';ctx.font='16px system-ui';ctx.fillText(c,pen,y);pen+=size*.6;continue;}if(g.width)ctx.drawImage(a.canvas,g.x,g.y,g.width,g.height,pen+g.left*size,y+g.top*size,g.width/m.capPixels*size,g.height/m.capPixels*size);pen+=g.advance*size+tracking;}}
function paint(){canvas.width=2880;canvas.height=1800;ctx.setTransform(2,0,0,2,0,0);ctx.fillStyle=light?'#dbd4c5':'#060910';ctx.fillRect(0,0,1440,900);ctx.fillStyle=light?'#494738':'#9aa9bf';ctx.font='12px system-ui';let y=28;const small=large?90:59;for(const p of ['bonus','counter']){ctx.fillText(p.toUpperCase()+' · ALPHABET',28,y);y+=15;line('ABCDEFGHIJKLM',p,30,y,small,large?3:15);y+=small*1.25;line('NOPQRSTUVWXYZ',p,30,y,small,large?3:15);y+=small*1.4;}ctx.fillStyle=light?'#494738':'#9aa9bf';ctx.fillText('COUNTERS · 107 PX BAND',28,y);y+=20;line('0/23  42  99  100', 'counter',30,y,107,5);y+=145;line('!?.,:;/-+\'"()%&','counter',30,y,65,8);y+=90;line('01:23.45  +3','bonus',30,y,65,4);}
document.getElementById('status').textContent=Object.keys(result.provenance).length+' modeled glyphs. Missing: '+(result.missing.join(' ')||'none');document.getElementById('light').onclick=()=>{light=!light;paint()};document.getElementById('size').onclick=()=>{large=!large;paint()};paint();window.rooModelFontPaint=paint;
</script></body></html>
