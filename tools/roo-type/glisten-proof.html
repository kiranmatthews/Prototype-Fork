<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><style>html,body{margin:0;background:#10151d;color:#dce6ef;font:14px system-ui}header{display:flex;gap:24px;align-items:center;padding:16px 24px}button{background:#273a4b;color:white;border:1px solid #687b8b;border-radius:4px;padding:7px 14px}canvas{display:block;width:100%;height:auto;max-width:1560px;margin:auto}output{color:#a9bfce}</style></head><body><header><strong>Approved neutral / image-model glisten</strong><button id="play">Pause</button><output id="phase"></output></header><canvas id="proof" width="1560" height="1060"></canvas><script type="module">
const base='/art/roo-reference-match/bake/',metrics=await fetch(base+'roo-counter-v6.json').then(r=>r.json());
const images=await Promise.all([0,1,2].map(f=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=base+`roo-counter-v6${f?'-light'+f:''}.png`;})));
const canvas=document.getElementById('proof'),ctx=canvas.getContext('2d'),scratch=document.createElement('canvas');let running=true,frozen=0;
const blend=scratch.getContext('2d');
function glyph(char,x,y,size,position){
 const g=metrics.glyphs[char],scale=size/metrics.capPixels;
 if(scratch.width!==g.width||scratch.height!==g.height){scratch.width=g.width;scratch.height=g.height;}
 blend.clearRect(0,0,g.width,g.height);blend.globalCompositeOperation='lighter';
 const weights=[1-Math.abs(position),Math.max(0,-position),Math.max(0,position)];
 for(const [i,weight]of weights.entries())if(weight){blend.globalAlpha=weight;blend.drawImage(images[i],g.x,g.y,g.width,g.height,0,0,g.width,g.height);}
 blend.globalAlpha=1;ctx.drawImage(scratch,x-g.width*scale/2,y-g.height*scale/2,g.width*scale,g.height*scale);
}
function paint(){
 const p=running?Math.sin(performance.now()/1000*Math.PI*2/8):frozen;canvas.dataset.phase=String(p);
 ctx.fillStyle='#10151d';ctx.fillRect(0,0,1560,1060);
 for(const [row,char]of ['A','0'].entries()){
  const cy=row*530+280;glyph(char,390,cy,480,0);glyph(char,1170,cy,480,p);
  ctx.fillStyle='#b8cadb';ctx.font='20px system-ui';ctx.textAlign='center';ctx.fillText(char+' · NEUTRAL',390,row*530+34);ctx.fillText(char+' · GLISTEN',1170,row*530+34);
 }
 document.getElementById('phase').textContent=`Frame blend ${p<0?'A':'B'} · ${Math.round(Math.abs(p)*100)}%`;
 requestAnimationFrame(paint);
}
document.getElementById('play').onclick=()=>{frozen=Number(canvas.dataset.phase);running=!running;document.getElementById('play').textContent=running?'Pause':'Play';};
window.glistenProof={ready:true};paint();
</script></body></html>
