<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"></head><body><script type="module">
import {goldToBonusReference,enhanceModelGlisten} from './artwork-palette.ts';
async function imageCanvas(frame){const image=new Image();image.src=`/fonts/roo-counter-v6${frame?'-light'+frame:''}.png`;await image.decode();const canvas=document.createElement('canvas');canvas.width=image.width;canvas.height=image.height;canvas.getContext('2d').drawImage(image,0,0);return canvas;}
const neutral=await imageCanvas(0);
window.refineFont=async frame=>{const gold=frame?enhanceModelGlisten(await imageCanvas(frame),neutral):neutral,green=goldToBonusReference(gold);return{counter:gold.toDataURL('image/png'),bonus:green.toDataURL('image/png')};};
</script></body></html>
