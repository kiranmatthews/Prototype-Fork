<!doctype html><meta charset="utf-8"><title>Nightworks review</title>
<style>body{margin:0;background:#0b1226;color:#fff;font:14px system-ui}nav{padding:8px;display:flex;gap:8px;flex-wrap:wrap}button{padding:6px 10px;background:#ebc57b;color:#18372d;border:0;border-radius:4px;cursor:pointer}iframe{border:0;width:100%;height:calc(100vh - 94px)}pre{margin:0 8px;font-size:12px}a{color:#ffe2a3}</style>
<nav id="poses"></nav><label><input id="art-protection" type="checkbox"> Protect player during art review</label><pre id="status">Loading game…</pre>
<iframe id="game" src="/?playtest&level=dark&frameprobe&renderdiag"></iframe>
<script type="module">
const frame=document.querySelector('#game'), bar=document.querySelector('#poses'), status=document.querySelector('#status');
const get=()=>frame.contentWindow.__game;
function button(label, fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;bar.append(b);}
const names=['Spawn','Lift bank','Phase pads','Grand rails','Lift stair','Rope ferries','Metronome II','Tower','Finale','Finish'];
const poses=[[0,.1,4],[0,.1,-46],[-47,12.1,-51],[-43,12.1,-112],[10,12.1,-170],[8,26.1,-202],[-48,26.1,-202],[-48,34.1,-278],[9,56.1,-324],[-43,70.1,-352]];
function place(i){const g=get();if(!g)return;const l=g.getLevel();g.player.pos.fromArray(poses[i]);g.player.speed=0;g.player.vVel=0;g.player.freeSkate=false;
  g.player.laneCursor.s=-1;g.player.settle(l);g.player.lives=20;g.player.snapRenderPose?.();frame.contentWindow.focus();}
names.forEach((n,i)=>button(n,()=>place(i)));
button('Ride first rope',()=>{const g=get(),l=g.getLevel(),r=l.ropeSwings[0];g.player.pos.copy(l.ropePointAt(r,5.8,g.player.pos));g.player.pos.y-=1;g.player.state='air';g.player.grounded=false;g.player.tryRopeGrab(l);g.player.snapRenderPose?.();});

function key(code,type){frame.contentWindow.dispatchEvent(new frame.contentWindow.KeyboardEvent(type,{code,key:code==='ArrowUp'?'ArrowUp':code==='Space'?' ':code==='KeyE'?'e':'x',bubbles:true}));}
function hold(code,ms){key(code,'keydown');setTimeout(()=>key(code,'keyup'),ms);}
button('Walk 2s',()=>hold('ArrowUp',2000));
button('Jump across',()=>{hold('ArrowUp',1300);hold('Space',250);});
button('Grind crossing',()=>{hold('KeyE',6500);hold('ArrowUp',6500);hold('Space',600);});
button('Fall into pit',()=>{const g=get(),l=g.getLevel();l.clearProjectiles();g.player.pos.set(-2,-8,-107);g.player.vVel=-4;g.player.speed=0;g.player.grounded=false;g.player.snapRenderPose?.();});
button('Checkpoint',()=>get().player.warpCheckpoint(get().getLevel(),1));
button('Lite render',()=>{frame.src='/?playtest&level=dark&frameprobe&renderdiag&lite';});
button('Restart',()=>{frame.src='/?playtest&level=dark&frameprobe&renderdiag';});
button('Editor',()=>{const g=get();if(!g.gameFlow.developerChromeVisible)key('KeyM','keydown');g.openEditor();});
setInterval(()=>{const w=frame.contentDocument,g=get();if(!w||!g)return;const d=JSON.parse(w.querySelector('#render-diagnostics')?.textContent||'{}');
 if(document.querySelector('#art-protection').checked){g.player.invulnTimer=.6;g.player.invulnSilent=true;}
 const f=JSON.parse(w.querySelector('#frame-probe')?.textContent||'{}');
 status.textContent=JSON.stringify({pos:[f.simX,f.simY,f.simZ],grounded:f.grounded,state:f.state,lives:g.player.lives,wind:d.jungle?.windTime,assets:g.getLevel().nightworksRocks?.diagnostics,frameTiming:d.frameTiming,draw:d.sceneDraw,buffer:d.drawingBuffer});
},250);
</script>
