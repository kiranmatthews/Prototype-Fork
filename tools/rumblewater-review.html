<!doctype html><html><head><meta charset="utf-8"><title>Rumblewater browser review</title><style>
html,body{margin:0;background:#14201d;color:#e8eadf;font:13px monospace}iframe,img{width:100vw;height:calc(100vh - 42px);border:0;object-fit:contain;background:#101816}#bar{height:42px;display:flex;align-items:center;gap:12px;padding:0 12px}button,a{color:inherit}#shots{display:flex;gap:3px;overflow:auto;min-width:0}#bar>b,#state,#download{flex-shrink:0}pre{white-space:pre-wrap;padding:12px}img{display:none}
</style></head><body><div id="bar"><b>Rumblewater · live input review</b><span id="state">Loading game</span><a id="download" hidden>Download frame</a><span id="shots"></span></div><iframe id="game"></iframe><img id="capture"><pre id="report"></pre><script type="module">
const q=new URLSearchParams(location.search),live=q.has('pilot')||q.has('vert'),take=q.has('vert')?'vert-transfer':q.get('pilot')||q.get('take')||'inner-low',at=Number(q.get('frame')||1e9),full=q.has('full');
const frame=document.querySelector('#game'),state=document.querySelector('#state'),report=document.querySelector('#report'),capture=document.querySelector('#capture');
const evidence={take,controller:live?'responsive inputs':'recorded inputs',render:full?'full':'lite',deaths:0,bails:0,unexpectedBails:0,entryTrips:0,frames:0,rails:[],checkpoints:[],errors:[],heroOutside:0,maxHeroX:0,maxHeroY:0,shots:[],samples:[],maskLosses:[],chaseStages:[],chaseEvents:[],forkChoices:[],maxTrickBoost:0};
frame.src=`../?playtest&level=rumblewater-run${full?'':'&lite'}`;
let g,w,done=false,wasDead=false,wasBail=false;const shots=new Map(),pendingShots=[],marks=[1050,2600,3550,4300,4930,5530,6000];
try{
 await new Promise((resolve,reject)=>{const began=Date.now(),timer=setInterval(()=>{
  w=frame.contentWindow;g=w?.__game;
  if(g&&!g.gameFlow.blocksGameplay){clearInterval(timer);resolve();}
  else if(Date.now()-began>180000){clearInterval(timer);reject(Error('Game did not become ready'));}
 },100);});
 w.addEventListener('error',e=>evidence.errors.push(e.message));w.addEventListener('unhandledrejection',e=>evidence.errors.push(String(e.reason)));
 const error=w.console.error;w.console.error=(...a)=>{evidence.errors.push(a.map(String).join(' '));error(...a);};
 g.renderQualitySettings.setRegularResolution(null);
 const p=g.player,l=g.getLevel();
 const station=q.has('station')?Number(q.get('station')):null;
 const data=!live&&station===null?await fetch(`./fixtures/rumblewater-${take}.json`).then(r=>r.json()):
  {v:2,level:'rumblewater-run',date:'review',tuning:{},tuningChanges:[],mx:Array(180).fill(0),my:Array(180).fill(0),b:Array(180).fill(0),frames:live?20000:180,truncated:false,surfaceFrictionPolicy:1};
 await l.prepareJungleAssets();
 let placement=data.startWorld;
 if(station!==null){const m=await import('../src/levels/rumblewater-run.ts');placement=m.rumblePoint(station,m.rumbleHeight(station)+.12,Number(q.get('offset')||0));}
 p.respawn(l,true,false,placement?{position:p.pos.clone().fromArray(placement)}:undefined);
 if(placement){l.boulder.course.reset(p.pos);evidence.fixture=placement;}
 p.commitRenderStep(l);
 let livePilot=null;
 if(q.has('vert')){const m=await import('../src/levels/rumblewater-run.ts'),v=await import('./rumblewater-vert-pilot.mjs');evidence.fixture=v.prepareRumblewaterVert(p,l,m);livePilot=v.createRumblewaterVertPilot(p,l,m);}
 else if(live)livePilot=(await import('./rumblewater-live-pilot.mjs')).createRumblewaterLivePilot(g,take);
 const frameNumber=()=>livePilot?livePilot.frame:g.replayer.frame;
 const old=p.step,oldBail=p.bail,oldSpendMask=p.spendMask,oldDie=p.die;
 p.die=function(cause,...a){evidence.deathCause=cause;return oldDie.call(this,cause,...a);};
 p.spendMask=function(...a){const spent=oldSpendMask.apply(this,a);if(spent)evidence.maskLosses.push({frame:frameNumber(),position:p.pos.toArray()});return spent;};
 p.bail=function(...a){evidence.lastBail={frame:frameNumber(),args:a,position:p.pos.toArray()};return oldBail.apply(this,a);};
 const snapshot=()=>({position:p.pos.toArray(),state:p.state,grounded:p.grounded,totalDeaths:p.totalDeaths,lives:p.lives,crates:p.cratesBroken,
  boulder:{progress:l.boulder.course.progress,playerProgress:l.boulder.course.playerProgress,active:l.boulder.course.active,falling:l.boulder.course.falling,stage:l.boulder.course.stage,sheltered:l.boulder.course.sheltered,overtakenSeconds:l.boulder.course.overtakenSeconds,sectionDeaths:l.boulder.course.sectionDeaths,forkChoices:l.boulder.course.forks.map(f=>f.choice),actors:l.boulder.course.actors.map(a=>({phase:a.phase,drop:a.drop,position:a.stone.mesh.position.toArray()}))},
  airTransfer:q.has('vert')?livePilot.report:undefined,camera:g.camera.position.toArray(),fov:g.camera.fov,aspect:g.camera.aspect,stamp:w.document.querySelector('.hud-build')?.textContent,
  resolution:{setting:g.renderQualitySettings.regularResolution,width:g.renderer.domElement.width,height:g.renderer.domElement.height},assets:l.jungleAssetDiagnostics,hazards:l.hazardAssetDiagnostics});
 const stop=()=>{
  if(done)return;done=true;evidence.final=snapshot();g.replayer.end();p.step=old;p.bail=oldBail;p.spendMask=oldSpendMask;p.die=oldDie;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
   capture.src=g.captureBonusReviewFrame();g.gameFlow.showPause({levelName:'Rumblewater Run',inWarpRoom:false});capture.style.display='block';frame.style.display='none';
   for(const [key,value]of shots){const b=document.createElement('button');b.textContent=String(key);b.onclick=()=>{capture.src=value;const l=document.querySelector('#download');l.href=value;l.download=`rumblewater-${key}.png`;};document.querySelector('#shots').append(b);}
   const link=document.querySelector('#download');link.href=capture.src;link.download=`rumblewater-${take}-${full?'full':'lite'}-${evidence.frames}.png`;link.hidden=false;
   state.textContent=`${evidence.final.state} · ${evidence.frames} frames · ${evidence.deaths} deaths · ${evidence.bails} bails`;
   report.textContent=JSON.stringify(evidence,null,2);report.dataset.done='true';
  }));
 };
 p.step=function(...a){
  const playing=live||g.replayer.active;
  if(live&&!done){try{const sample=livePilot.next();if(!sample){stop();return;}Object.assign(a[1],sample);}catch(e){evidence.errors.push(String(e));stop();return;}}
  const result=old.apply(this,a);if(!playing||done)return result;
  evidence.frames=frameNumber();evidence.maxTrickBoost=Math.max(evidence.maxTrickBoost,p.trickSpeedBoost);
  if(!evidence.chaseStages.includes(l.boulder.course.stage))evidence.chaseStages.push(l.boulder.course.stage);
  for(const [index,fork]of l.boulder.course.forks.entries())if(fork.locked&&!evidence.forkChoices.some(f=>f.index===index)){
   evidence.forkChoices.push({index,choice:fork.choice,frame:evidence.frames});
   pendingShots.push({frame:evidence.frames+Math.round((fork.end-fork.start)*.45/l.boulder.course.speed*60),key:'fork-'+index+'-'+fork.choice});
  }
  for(const e of l.boulder.course.events){
   evidence.chaseEvents.push({frame:evidence.frames,kind:e.kind,stage:e.actor.index});
   if(e.kind==='gate'||e.kind==='release')pendingShots.push({frame:evidence.frames+(e.kind==='gate'?1:18),key:(e.kind==='gate'?'gate-':'drop-')+e.actor.index});
  }if(evidence.frames%120===0)evidence.samples.push({frame:evidence.frames,position:p.pos.toArray(),speed:p.speed,state:p.state,masks:p.masks});const dead=p.state==='dead'||p.state==='gameover';if(dead&&!wasDead)evidence.deaths++;if(p.isBailing&&!wasBail){evidence.bails++;if(!p.checkpointTripActive)evidence.unexpectedBails++;}evidence.entryTrips=p.checkpointTripCount;wasDead=dead;wasBail=p.isBailing;
  if(p.grindRail){const rail=l.rails.indexOf(p.grindRail);if(!evidence.rails.includes(rail))evidence.rails.push(rail);}
  for(let i=0;i<l.checkpoints.length;i++)if(l.checkpoints[i].active&&!evidence.checkpoints.includes(i))evidence.checkpoints.push(i);
  state.textContent=`${take} · frame ${evidence.frames}/${data.frames} · ${p.state}`;
  if(evidence.frames>=at||p.state==='finished'||!['recovery','late-recovery'].includes(take)&&(evidence.deaths||evidence.unexpectedBails)||evidence.frames>=data.frames)stop();
  return result;
 };
 function measure(){
  if(done)return;const b=p.cameraPoseBounds;
  for(const shot of pendingShots)if(frameNumber()>=shot.frame&&!shots.has(shot.key)){shots.set(shot.key,g.captureBonusReviewFrame());evidence.shots.push(shot.key);}
  for(const mark of marks)if(frameNumber()>=mark&&!shots.has(mark)){shots.set(mark,g.captureBonusReviewFrame());evidence.shots.push(mark);}
  if((live||g.replayer.active)&&b&&!b.isEmpty()&&p.state!=='dead'){
   const v=p.pos.clone();let x=0,y=0;
   for(const xx of [b.min.x,b.max.x])for(const yy of [b.min.y,b.max.y])for(const zz of [b.min.z,b.max.z]){
    v.set(xx,yy,zz).project(g.camera);x=Math.max(x,Math.abs(v.x));y=Math.max(y,Math.abs(v.y));
   }evidence.maxHeroX=Math.max(evidence.maxHeroX,x);evidence.maxHeroY=Math.max(evidence.maxHeroY,y);if(x>1||y>1)evidence.heroOutside++;
  }requestAnimationFrame(measure);
 }
 if(!live)g.replayer.begin(data);requestAnimationFrame(measure);
}catch(e){state.textContent='Review failed';report.textContent=String(e.stack||e);report.dataset.done='true';}
</script></body></html>
