<!doctype html><meta charset="utf-8"><title>Ancient Gates art review</title>
<style>html,body{margin:0;background:#142426;color:#fff;font:12px system-ui;height:100%;overflow:hidden}iframe{border:0;width:100%;height:calc(100% - 48px)}nav{height:48px;display:flex;align-items:center;gap:6px;padding:0 8px}button,select{background:#274b48;color:white;border:1px solid #82bba2;border-radius:4px;padding:7px}output{white-space:pre;overflow:auto;position:absolute;right:10px;bottom:58px;max-height:45%;max-width:600px;background:#10211fee;font-size:11px;padding:8px;display:none}output.open{display:block}</style>
<iframe id="game" title="Ancient Gates game"></iframe>
<nav><button id="main">Main route</button><button id="bonus">Hoard</button><select id="section" aria-label="Review section"></select><button id="warp">View section</button><button id="native">MAX / native</button><button id="normal">Normal resolution</button><button id="checkpoint">Next checkpoint</button><button id="pit">Pit respawn</button><button id="restore">Restore masonry</button><button id="drop">Drop step</button><button id="snapshot">Read state</button><span id="status">Loading…</span></nav><output id="report"></output>
<script type="module">
const frame=document.querySelector('#game'),status=document.querySelector('#status'),report=document.querySelector('#report'),select=document.querySelector('#section');
const params=new URLSearchParams(location.search),lite=params.has('lite');let bonus=false,errors=[];
const mainViews=[['Root Steps',-17,0],['First trap door',85,3],['Second trap door',129,3],['Falling lintels',177,10],['Crown lift',416,7],['Sunken seal',1073,10],['Split Gate',147,3],['Mossback',245,5],['Counterweight',370,7],['Hammer Gallery',473,14],['Aqueduct',620,9],['Bristle Orchard',730,8],['Lantern Crossing',884,7.4],['Wind Bells',983,11],['Sunken Switchyard',1117,8],['Crown Ascent',1195,8],['Last Gate',1292.8,24],['Finish gate',1376,16]];
const bonusViews=[['Hoard arrival',-8,0],['Jade gallery',15,0],['Causeway seal',47,0],['Hoard court',35,0],['Copper store',92,0],['Treasury',143,0],['Return passage',166,0],['Hoard departure',191,0]];
const views=()=>bonus?bonusViews:mainViews;const g=()=>frame.contentWindow.__game;
function start(value){bonus=value;select.replaceChildren(...views().map(([label],i)=>new Option(label,String(i))));frame.src='/?playtest&level='+(bonus?'bonus-jungle-gate':'jungle-gate-run')+(lite?'&lite':'');}
frame.addEventListener('load',()=>{frame.contentWindow.addEventListener('error',e=>errors.push(e.message));});
async function snap(){const game=g();if(!game)return;await game.getLevel().prepareJungleAssets();const state={level:game.getCurrentLevel().id,position:game.player.pos.toArray(),grounded:game.player.grounded,ground:game.player.groundHit?.name,camera:game.camera.position.toArray(),buffer:[game.renderer.domElement.width,game.renderer.domElement.height],assets:game.getLevel().jungleAssetDiagnostics,mechanisms:game.getLevel().ancientMechanismDiagnostics,bridges:game.getLevel().spinBridges.map(b=>({state:b.state,deployed:b.deployed})),falling:game.getLevel().crumbles.map(c=>({state:c.state,y:c.mesh.position.y})),render:{...game.renderer.info.render},stamp:frame.contentDocument.querySelector('.hud-build')?.textContent,errors};report.textContent=JSON.stringify(state,null,2);status.textContent=state.grounded?'Grounded · '+state.render.triangles.toLocaleString()+' triangles':'In air';}
document.querySelector('#main').onclick=()=>start(false);document.querySelector('#bonus').onclick=()=>start(true);
document.querySelector('#warp').onclick=()=>{const [,x,y]=views()[Number(select.value)],game=g();game.player.respawn(game.getLevel(),true,false,{position:game.player.pos.clone().set(x,y+.12,0)});report.classList.remove('open');frame.focus();};
document.querySelector('#native').onclick=()=>{g().renderQualitySettings.setRegularResolution(null);g().crtGuestSettings.setEnabled(false);report.classList.remove('open');};
document.querySelector('#normal').onclick=()=>{g().renderQualitySettings.setRegularResolution(720);report.classList.remove('open');};
document.querySelector('#checkpoint').onclick=()=>{g().player.warpCheckpoint(g().getLevel(),1);report.classList.remove('open');frame.focus();};
document.querySelector('#pit').onclick=()=>{g().player.respawn(g().getLevel(),true,false,{position:g().player.pos.clone().set(8,-24,0)});report.classList.remove('open');frame.focus();};
document.querySelector('#restore').onclick=()=>{const l=g().getLevel();for(const c of l.crates)if(c.bang)l.triggerBang(c);report.classList.remove('open');frame.focus();};
document.querySelector('#drop').onclick=()=>{g().getLevel().touchCrumble(0);report.classList.remove('open');frame.focus();};
document.querySelector('#snapshot').onclick=async()=>{await snap();report.classList.toggle('open');};
setInterval(()=>{if(g()&&!g().gameFlow.blocksGameplay)status.textContent=(g().player.grounded?'Grounded':'In air')+' · '+Math.round(g().player.pos.x)+'m';},500);start(false);
</script>
