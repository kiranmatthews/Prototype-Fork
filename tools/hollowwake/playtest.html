<!doctype html><html><head><meta charset="utf-8"><title>Hollowwake input playback</title><style>html,body{margin:0;background:#101820;color:#dce8ef;font:13px system-ui}nav{height:44px;display:flex;align-items:center;gap:12px;padding:0 12px}#stage{height:calc(100vh - 44px);overflow:hidden;position:relative}iframe{border:0;transform-origin:top left}#capture{width:100%;height:100%;object-fit:contain;display:none}pre{white-space:pre-wrap;padding:12px}#shots{display:flex;gap:4px}</style></head><body><nav><b>Hollowwake · ordinary input playback</b><button id="start" disabled>Run route</button><button id="save" disabled>Save evidence</button><span id="status">Loading</span><span id="shots"></span></nav><div id="stage"><iframe id="game"></iframe><img id="capture"></div><pre id="report"></pre><script type="module">
const q=new URLSearchParams(location.search),mode=q.get('route')||'left',full=q.has('full'),iframe=document.querySelector('#game'),capture=document.querySelector('#capture'),status=document.querySelector('#status'),output=document.querySelector('#report');
const width=full?1920:3840,height=full?1080:2160;iframe.style.width=width+'px';iframe.style.height=height+'px';const fit=()=>iframe.style.transform=`scale(${Math.min(innerWidth/width,(innerHeight-44)/height)})`;addEventListener('resize',fit);fit();iframe.src=`../../?playtest&level=hollowwake-descent${full?'':'&lite'}`;
const evidence={mode,full,frames:0,deaths:0,unexpectedBails:0,checkpoints:[],forks:[],shots:[],errors:[],maxHeroX:0,maxHeroY:0,renderTimes:[]},shots=new Map(),marks=[45,220,368,600,1050,1180,1400,1620,1900,2060,2260,2455];let g,w,p,l,done=false,started=false,wasBail=false,step,lastRender=0;
const select=key=>{capture.src=shots.get(key);capture.style.display='block';iframe.style.display='none';};
try{
 await new Promise((resolve,reject)=>{const began=Date.now(),timer=setInterval(()=>{w=iframe.contentWindow;g=w?.__game;if(g&&!g.gameFlow.blocksGameplay){clearInterval(timer);resolve();}else if(Date.now()-began>180000){clearInterval(timer);reject(Error('Game not ready'));}},100);});
 w.addEventListener('error',e=>evidence.errors.push(e.message));w.addEventListener('unhandledrejection',e=>evidence.errors.push(String(e.reason)));
 g.renderQualitySettings.setRegularResolution(null);g.crtGuestSettings.setEnabled(full);p=g.player;l=g.getLevel();await l.prepareJungleAssets();
 const m=await import('../../src/levels/hollowwake-route.ts'),data=await fetch('./replay-'+mode+'.json').then(r=>r.json());
 const snapshot=()=>({position:p.pos.toArray(),state:p.state,deaths:p.totalDeaths,checkpoints:l.checkpoints.filter(c=>c.active).length,forks:l.boulder.course.forks.map(f=>f.choice),tunnels:l.hollowwakeDiagnostics,assets:l.jungleAssetDiagnostics,hazards:l.hazardAssetDiagnostics,resolution:{setting:g.renderQualitySettings.regularResolution,width:g.renderer.domElement.width,height:g.renderer.domElement.height}});
 const stop=()=>{if(done)return;done=true;evidence.final=snapshot();g.replayer.end();p.step=step;requestAnimationFrame(()=>{
  shots.set('finish',g.captureBonusReviewFrame());g.gameFlow.showPause({levelName:'Hollowwake Descent',inWarpRoom:false});
  evidence.pass=evidence.final.state==='finished'&&evidence.final.checkpoints===5&&evidence.final.deaths===0&&!evidence.unexpectedBails&&!evidence.errors.length;
  for(const key of shots.keys()){const b=document.createElement('button');b.textContent=key;b.onclick=()=>select(key);document.querySelector('#shots').append(b);}select('finish');
  const times=evidence.renderTimes.slice().sort((a,b)=>a-b);evidence.rafTiming={samples:times.length,medianMs:times[Math.floor(times.length/2)],p95Ms:times[Math.floor(times.length*.95)],maxMs:times.at(-1)};delete evidence.renderTimes;output.textContent=JSON.stringify(evidence,null,2);output.dataset.done='true';document.querySelector('#save').disabled=false;status.textContent=evidence.pass?'PASS · complete input-driven route':'Review needs attention';
 });};
 document.querySelector('#start').disabled=false;status.textContent='Ready · Max/native rendering';
 document.querySelector('#start').onclick=()=>{if(started)return;started=true;document.querySelector('#start').disabled=true;p.respawn(l,true);p.commitRenderStep(l);step=p.step;
  p.step=function(...args){const result=step.apply(this,args);if(done)return result;evidence.frames=g.replayer.frame;evidence.deaths=p.totalDeaths;if(p.isBailing&&!wasBail&&!p.checkpointTripActive)evidence.unexpectedBails++;wasBail=p.isBailing;for(const [i,c]of l.checkpoints.entries())if(c.active&&!evidence.checkpoints.includes(i))evidence.checkpoints.push(i);for(const [i,f]of l.boulder.course.forks.entries())if(f.locked&&!evidence.forks.some(r=>r.index===i))evidence.forks.push({index:i,choice:f.choice});status.textContent=`${mode} · ${evidence.frames}/${data.frames} · checkpoint ${evidence.checkpoints.length}/5`;if(p.state==='finished'||p.totalDeaths||evidence.unexpectedBails||evidence.frames>=data.frames)stop();return result;};
  g.replayer.begin(data);requestAnimationFrame(measure);
 };
 function measure(now){if(done)return;const at=m.hollowProgress(p.pos),mark=marks.find(s=>at>=s&&!shots.has(String(s)));if(mark!==undefined){shots.set(String(mark),g.captureBonusReviewFrame());evidence.shots.push(mark);}if(lastRender&&evidence.renderTimes.length<1000)evidence.renderTimes.push(now-lastRender);lastRender=now;const b=p.cameraPoseBounds;if(b&&!b.isEmpty())for(const x of[b.min.x,b.max.x])for(const y of[b.min.y,b.max.y])for(const z of[b.min.z,b.max.z]){const v=p.pos.clone().set(x,y,z).project(g.camera);evidence.maxHeroX=Math.max(evidence.maxHeroX,Math.abs(v.x));evidence.maxHeroY=Math.max(evidence.maxHeroY,Math.abs(v.y));}requestAnimationFrame(measure);}
 document.querySelector('#save').onclick=async()=>{try{for(const [key,png]of shots){const response=await fetch('http://127.0.0.1:5204/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:`level-route-${mode}-${key}-${full?'full':'lite'}`,png})});if(!response.ok)throw Error(await response.text());}status.textContent='Saved native frames';}catch(e){status.textContent=String(e);}};
}catch(e){status.textContent='Review failed';output.textContent=String(e.stack??e);}
</script></body></html>
