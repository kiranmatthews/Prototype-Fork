<!doctype html><html><head><meta charset="utf-8"><title>Hollowwake asset review</title><style>body{margin:0;background:#151a21;color:#eee;font:14px system-ui}#bar{height:40px;display:flex;gap:10px;align-items:center;padding:0 12px}canvas{display:block;width:100vw;height:calc(100vh - 40px);object-fit:contain}#native{display:none}</style></head><body><div id="bar"><select id="asset"><option>round-cave-bore</option><option>timber-tunnel-rib</option><option>glow-fungus</option><option>rusted-floodgate</option><option>crowngrottofloor</option></select><button id="front">Front</button><button id="quarter">Three-quarter</button><button id="back">Back</button><button id="save">Save native PNG</button><span id="status">Loading</span></div><img id="native"><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/examples/jsm/loaders/GLTFLoader.js';
const names=['round-cave-bore','timber-tunnel-rib','glow-fungus','rusted-floodgate'],select=document.querySelector('#asset'),status=document.querySelector('#status'),native=document.querySelector('#native');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);renderer.setSize(3840,2160,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#5d6571');scene.add(new THREE.HemisphereLight('#e6edf7','#434956',2));const key=new THREE.DirectionalLight('#f4e5d1',3.1);key.position.set(3,5,5);scene.add(key);const fill=new THREE.DirectionalLight('#9fc3df',1.3);fill.position.set(-4,2,-3);scene.add(fill);
let model,yaw=0,name=names[0],drawVersion=0;const camera=new THREE.PerspectiveCamera(37,3840/2160,.001,1000),cache=new Map();
async function draw(){const version=++drawVersion,requested=name;status.textContent='Loading '+name;let next=cache.get(requested);if(!next){next=(await new GLTFLoader().loadAsync(requested==='crowngrottofloor'?'/drowned-crown/excellence/grotto-floor.glb':'/hollowwake/'+requested+'.glb')).scene;next.traverse(o=>{if(o.name.endsWith('LOD1'))o.visible=false;});cache.set(requested,next);}if(version!==drawVersion)return;if(model)scene.remove(model);model=next;scene.add(model);model.updateMatrixWorld(true);const box=new THREE.Box3();let triangles=0;model.traverse(o=>{if(o.isMesh&&o.visible){o.geometry.computeBoundingBox();box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));triangles+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3;}});const size=box.getSize(new THREE.Vector3()),centre=box.getCenter(new THREE.Vector3()),distance=Math.max(size.y,size.x/camera.aspect,size.z*.5)*2.25;camera.near=distance/1000;camera.far=distance*20;camera.updateProjectionMatrix();camera.position.copy(centre).add(new THREE.Vector3(Math.sin(yaw)*Math.cos(.15),Math.sin(.15),Math.cos(yaw)*Math.cos(.15)).multiplyScalar(distance));camera.lookAt(centre);renderer.render(scene,camera);native.src=renderer.domElement.toDataURL('image/png');status.textContent=JSON.stringify({name,yaw,size:size.toArray(),triangles,width:3840,height:2160});}
select.onchange=()=>{name=select.value;void draw();};document.querySelector('#front').onclick=()=>{yaw=0;void draw();};document.querySelector('#quarter').onclick=()=>{yaw=.7;void draw();};document.querySelector('#back').onclick=()=>{yaw=Math.PI;void draw();};document.querySelector('#save').onclick=async()=>{const response=await fetch('http://127.0.0.1:5204/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'asset-'+name+'-'+(yaw===0?'front':yaw===Math.PI?'back':'quarter'),png:native.src})});status.textContent=response.ok?'Saved '+name+' at 3840×2160':await response.text();};await draw();
</script></body></html>
