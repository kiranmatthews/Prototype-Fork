<!doctype html><html><head><meta charset="utf-8"><title>Hollowwake native gameplay review</title><style>html,body{margin:0;background:#111922;color:#d9e9ee;font:13px system-ui}#bar{height:44px;display:flex;gap:10px;align-items:center;padding:0 12px}#stage{height:calc(100vh - 44px);position:relative;overflow:hidden}iframe{width:3840px;height:2160px;transform-origin:top left;border:0}#capture{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}pre{white-space:pre-wrap;padding:12px}button,a{color:inherit}</style></head><body><div id="bar"><b>Hollowwake · 3840 × 2160</b><select id="station"><option value="0">Release</option><option value="180">First split</option><option value="270">Twin drains</option><option value="364">Dry refuge</option><option value="610">Timber drains</option><option value="970">Raised siphon</option><option value="1400">Wormwheel bends</option><option value="1860">Drowned crossing</option><option value="2260">Wreck throat</option><option value="2470">Exit</option></select><select id="branch"><option value="0">Left route</option><option value="1">Right route</option></select><button id="take" disabled>Capture</button><button id="save" disabled>Save native PNG</button><span id="status">Loading</span></div><div id="stage"><iframe id="game"></iframe><img id="capture"></div><pre id="report"></pre><script type="module">
const q=new URLSearchParams(location.search),at=Number(q.get('station')||0),branch=Number(q.get('branch')||0),full=q.has('full');
const iframe=document.querySelector('#game'),capture=document.querySelector('#capture'),status=document.querySelector('#status'),report=document.querySelector('#report');
const reviewWidth=full?1920:3840,reviewHeight=full?1080:2160;iframe.style.width=reviewWidth+'px';iframe.style.height=reviewHeight+'px';const fit=()=>{iframe.style.transform=`scale(${Math.min(innerWidth/reviewWidth,(innerHeight-44)/reviewHeight)})`;};addEventListener('resize',fit);fit();
iframe.src=`../../?playtest&level=hollowwake-descent${full?'':'&lite'}`;
let g,w,p,l,shot;const errors=[];document.querySelector('#station').value=String(at);document.querySelector('#branch').value=String(branch);
const go=()=>{location.href=`?station=${document.querySelector('#station').value}&branch=${document.querySelector('#branch').value}${full?'&full':''}`;};document.querySelector('#station').onchange=go;document.querySelector('#branch').onchange=go;
try{
 await new Promise((resolve,reject)=>{const began=Date.now(),timer=setInterval(()=>{w=iframe.contentWindow;g=w?.__game;if(g&&!g.gameFlow.blocksGameplay){clearInterval(timer);resolve();}else if(Date.now()-began>180000){clearInterval(timer);reject(Error('Game not ready'));}},100);});
 w.addEventListener('error',e=>errors.push(e.message));w.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
 g.renderQualitySettings.setRegularResolution(null);g.crtGuestSettings.setEnabled(full);
 p=g.player;l=g.getLevel();await l.prepareJungleAssets();const m=await import('../../src/levels/hollowwake-route.ts');
 // Declared static inspection fixture. Route traversal is verified separately.
 p.respawn(l,true,false,{position:p.pos.clone().fromArray(m.hollowPoint(at,branch,0,.15))});l.boulder.course.reset(p.pos);p.commitRenderStep(l);
 const step=p.step;p.step=function(dt,input,level){Object.assign(input,{moveX:0,moveY:0,jumpHeld:false,jumpPressed:false,jumpReleased:false,grindHeld:false,grindPressed:false,spinHeld:false,spinPressed:false,grabHeld:false,grabPressed:false,transferHeld:false,transferPressed:false,restartPressed:false});return step.call(this,dt,input,level);};
 document.querySelector('#take').disabled=false;status.textContent='Ready · Max/native rendering';
 document.querySelector('#take').onclick=()=>{
  shot=g.captureBonusReviewFrame();capture.src=shot;capture.style.display='block';iframe.style.visibility='hidden';g.gameFlow.showPause({levelName:'Hollowwake Descent',inWarpRoom:false});
  report.textContent=JSON.stringify({fixture:{at,branch},position:p.pos.toArray(),state:p.state,camera:g.camera.position.toArray(),fov:g.camera.fov,resolution:{setting:g.renderQualitySettings.regularResolution,width:g.renderer.domElement.width,height:g.renderer.domElement.height},tunnels:l.hollowwakeDiagnostics,assets:l.jungleAssetDiagnostics,errors},null,2);
  document.querySelector('#save').disabled=false;status.textContent='Captured native game frame';
 };
 document.querySelector('#save').onclick=async()=>{const response=await fetch('http://127.0.0.1:5204/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:`level-${at}-${branch}-${full?'full':'lite'}`,png:shot})});status.textContent=response.ok?'Saved native 4K PNG':await response.text();};
}catch(e){status.textContent=String(e);report.textContent=String(e.stack??e);}
</script></body></html>
