<!doctype html><meta charset="utf-8"><title>Jungle Ruins review</title>
<style>body{margin:0;background:#17352e;color:#fff;font:14px system-ui}nav{padding:8px;display:flex;gap:8px;flex-wrap:wrap}button{padding:6px 10px;background:#ebc57b;color:#18372d;border:0;border-radius:4px;cursor:pointer}iframe{border:0;width:100%;height:calc(100vh - 94px)}pre{margin:0 8px;font-size:12px}a{color:#ffe2a3}</style>
<nav id="poses"></nav><pre id="status">Loading game…</pre>
<iframe id="game" src="/?playtest&level=jungle&frameprobe&renderdiag"></iframe>
<script type="module">
const frame=document.querySelector('#game'), bar=document.querySelector('#poses'), status=document.querySelector('#status');
const get=()=>frame.contentWindow.__game;
function button(label, fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;bar.append(b);}
const names=['Spawn','Pit hop','Ravine log','Temple climb','Temple terrace','Descent','Finish'];
const poses=[[3.73,1.78,6],[-2,0,-100],[-5,0,-172],[0,0,-318],[0,11.5,-398],[0,4.5,-470],[0,0,-688]];
function place(i){const g=get();if(!g)return;const l=g.getLevel();const [x,y,z]=poses[i];
  let px=x,py=y;
  if(i<3){const lane=l.lanePts.reduce((a,b)=>Math.abs(b.z-z)<Math.abs(a.z-z)?b:a);px=lane.x;py=lane.y;}
  g.player.pos.set(px,py+0.15,z);g.player.speed=0;g.player.vVel=0;g.player.freeSkate=false;
  g.player.laneCursor.s=-1;g.player.settle(l);g.player.lives=20;l.clearProjectiles();
  g.player.snapRenderPose?.();frame.contentWindow.focus();
}
names.forEach((n,i)=>button(n,()=>place(i)));
function key(code,type){frame.contentWindow.dispatchEvent(new frame.contentWindow.KeyboardEvent(type,{code,key:code==='ArrowUp'?'ArrowUp':code==='Space'?' ':code==='KeyE'?'e':'x',bubbles:true}));}
function hold(code,ms){key(code,'keydown');setTimeout(()=>key(code,'keyup'),ms);}
button('Walk 2s',()=>hold('ArrowUp',2000));
button('Jump across',()=>{hold('ArrowUp',1300);hold('Space',250);});
button('Grind crossing',()=>{hold('KeyE',6500);hold('ArrowUp',6500);hold('Space',600);});
button('Fall into pit',()=>{const g=get(),l=g.getLevel();l.clearProjectiles();g.player.pos.set(-2,-8,-107);g.player.vVel=-4;g.player.speed=0;g.player.grounded=false;g.player.snapRenderPose?.();});
button('Checkpoint',()=>get().player.warpCheckpoint(get().getLevel(),1));
button('Restart',()=>{frame.src='/?playtest&level=jungle&frameprobe&renderdiag';});
button('Editor',()=>get().openEditor());
setInterval(()=>{const w=frame.contentDocument,g=get();if(!w||!g)return;const d=JSON.parse(w.querySelector('#render-diagnostics')?.textContent||'{}');
 const f=JSON.parse(w.querySelector('#frame-probe')?.textContent||'{}');
 status.textContent=JSON.stringify({pos:[f.simX,f.simY,f.simZ],grounded:f.grounded,state:f.state,lives:g.player.lives,wind:d.jungle?.windTime,assets:d.jungle,frameTiming:d.frameTiming,draw:d.sceneDraw,buffer:d.drawingBuffer});
},250);
</script>
