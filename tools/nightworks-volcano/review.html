<!doctype html><html><head><meta charset="utf-8"><title>Nightworks volcano material review</title><style>body{margin:0;background:#101624;color:#eee;font:14px system-ui}canvas{display:block;width:100vw;height:90vh}.labels{display:flex;justify-content:space-around;padding:12px}</style></head><body><div class="labels"><span>Front · 0°</span><span>90°</span><span>180°</span><span>270°</span></div><script type="module">
import * as THREE from 'three';
import {createJungleAssetScope,configureJungleAssetRenderer} from '/src/jungleAssets.ts';
import {createNightworksVolcanoMaterial} from '/src/nightworksMagma.ts';
