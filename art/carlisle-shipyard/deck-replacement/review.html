<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carlisle whole-deck review</title><link rel="icon" href="data:,"><style>body{margin:0;background:#101d2c;font:14px system-ui;color:white}nav{position:absolute;top:20px;left:24px;z-index:1}button,select{padding:9px;margin:3px;background:#21384e;color:white;border:1px solid #506272}p{margin:6px}canvas{display:block}</style><nav><strong>Whole timber deck · Merchant Wreck reference</strong><p><select id="asset"><option value="p2">Chunky timber · original</option><option value="broad">Broad quay · original</option><option value="reference">Merchant Wreck opening</option></select><button id="front">Three quarter</button><button id="top">Top</button><button id="low">Low</button><button id="light">Early night / studio</button></p><p id="status">Loading</p></nav><script type="module">

async function load(){if(root)scene.remove(root);const kind=document.querySelector('#asset').value,url=kind==='p2'?'/props/carlisle-decks/solid-timber.glb':kind==='broad'?'/props/carlisle-decks/broad-deck.glb':'/drowned-crown/excellence/crash-boardwalk-section.glb';const gltf=await new GLTFLoader().loadAsync(url);root=gltf.scene;root.traverse(n=>{if(/LOD|shadow/i.test(n.name))n.visible=false});const b=new T.Box3().setFromObject(root),s=b.getSize(new T.Vector3()),c=b.getCenter(new T.Vector3());root.scale.setScalar(24/Math.max(s.x,s.z));root.position.copy(c).multiplyScalar(-root.scale.x);scene.add(root);let faces=0;root.traverse(n=>{if(n.isMesh&&n.visible){faces+=(n.geometry.index?.count??n.geometry.attributes.position.count)/3;for(const m of Array.isArray(n.material)?n.material:[n.material])if(m.map)m.map.anisotropy=8}});document.querySelector('#status').textContent=faces.toLocaleString()+' original triangles · full mesh at every distance';window.deckReady=true;}
