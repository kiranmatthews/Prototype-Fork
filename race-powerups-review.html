<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Power-up studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c2c;color:#e9f8ff;font:14px system-ui}header{padding:22px 32px 14px;display:flex;justify-content:space-between;align-items:center;gap:24px}h1{font-size:25px;margin:0}p{margin:5px 0;color:#a9bfd1}button,select{padding:10px 14px;border:1px solid #62788a;border-radius:7px;background:#24394b;color:white;margin:3px;font:inherit;cursor:pointer}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 30px 24px}.card{height:clamp(155px,calc((100vh - 156px)/3),224px);background:linear-gradient(145deg,#20384a,#162535);border:1px solid #345166;border-radius:14px;position:relative}.stage{height:calc(100% - 47px)}.label{padding:0 16px;font-weight:700;letter-spacing:.03em}.budget{color:#8fb2c4;font:11px monospace;margin:5px 16px}canvas{position:fixed;inset:0;pointer-events:none;z-index:1}header,#status,.label,.budget{position:relative;z-index:2}#effects{height:calc(100vh - 145px);margin:0 30px;background:#264e3c;border-radius:15px;position:relative}#effects[hidden],#grid[hidden]{display:none}#status{padding:0 32px 12px;color:#91c8d6;font:12px monospace}#fx-controls{display:none}.fx #fx-controls{display:block}.fx #model-controls{display:none}@media(max-width:700px){#grid{grid-template-columns:repeat(3,1fr);padding:0 10px}.card{height:180px}.stage{height:133px}header{padding:12px;font-size:12px}h1{font-size:20px}.label{font-size:12px;padding:0 7px}}
</style></head><body><header><div><h1>POWER-UPS</h1><p>Chunky enamel shapes · vertex-lit colour · feathered polygon effects</p></div><div><button id="models">Models</button><button id="fx">Effects</button><span id="model-controls"><button id="rotate">Resume rotation</button><button id="bake">Bake HUD pictures</button></span><span id="fx-controls"><select aria-label="Effect" id="kind"></select><button id="burst">Play effect</button><button id="freeze">Pause effects</button><button id="stress">Busy race</button></span></div></header><div id="status" role="status">Preparing local models…</div><main id="grid"></main><div id="effects" hidden></div><script type="module" src="/tools/race-powerups-review.ts"></script></body></html>
