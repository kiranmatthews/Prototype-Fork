<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fire v4 · Motion review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#142730;color:#ecf3ef;font:15px system-ui}header{padding:18px 28px;border-bottom:1px solid #47606b;display:flex;gap:25px;align-items:center}h1{font-size:22px;margin:0}small{color:#b4c6cd}main{height:calc(100vh - 170px);display:flex;justify-content:center;align-items:center}img{width:100%;height:100%;object-fit:contain}.controls{padding:15px 28px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}button,select{padding:9px 14px;background:#243f4b;color:#fff;border:1px solid #7694a0;border-radius:6px}input[type=range]{width:35vw}#frame{font-variant-numeric:tabular-nums;min-width:155px}.checker main{background:repeating-conic-gradient(#33444d 0% 25%,#17252e 0% 50%) 0/40px 40px}a{color:#f2cd91}
</style>
<header><h1>Fire v4 / Motion review</h1><small>AUTHORING REVIEW · Native originals · No frame blending</small><a href="../../../../fire-sprite-lab.html">Exhibition</a></header>
<main><img id="drawing" alt="Current original flame animation drawing"></main>
<div class="controls"><select id="family" aria-label="Flame family"><option>narrow</option><option>medium</option><option>broad</option></select><button id="play">Pause</button><button id="previous">Previous cel</button><button id="next">Next cel</button><select id="speed" aria-label="Playback speed"><option value="1">1× speed</option><option value="0.25">¼ speed</option><option value="0.5">½ speed</option></select><input id="seek" type="range" min="0" max="47" value="0" aria-label="Animation phase"><output id="frame"></output><label><input id="checker" type="checkbox"> Checkerboard</label></div>
<script type="module">
const $=id=>document.getElementById(id),record=await(await fetch('./generation.json')).json();
const families=Object.fromEntries(['narrow','medium','broad'].map(f=>[f,record.frames.filter(x=>x.family===f).sort((a,b)=>a.phase-b.phase)]));
const images=new Map();await Promise.all(record.frames.map(async f=>{const i=new Image();i.src='../../../../'+f.file;await i.decode();images.set(f.file,i);}));
let phase=0,paused=false,last=performance.now(),current='',selected='narrow';
function show(){const frames=families[selected],p=Math.floor(phase)%48;const f=frames.findLast(x=>x.phase<=p)||frames.at(-1);if(current!==f.file){$('drawing').src=images.get(f.file).src;current=f.file;}$('seek').value=p;$('frame').textContent=`${selected} · ${String(f.phase).padStart(2,'0')} / 47 · ${frames.length} cels`;}
function pause(value){paused=value;$('play').textContent=paused?'Play':'Pause';}
$('play').onclick=()=>pause(!paused);$('family').onchange=()=>{selected=$('family').value;phase=0;show();};$('seek').oninput=()=>{pause(true);phase=Number($('seek').value);show();};$('checker').onchange=()=>document.body.classList.toggle('checker',$('checker').checked);
function step(direction){pause(true);const frames=families[selected],index=frames.findLastIndex(x=>x.phase<=Math.floor(phase));phase=frames[(index+direction+frames.length)%frames.length].phase;show();}
$('previous').onclick=()=>step(-1);$('next').onclick=()=>step(1);
function tick(now){const dt=Math.max(0,Math.min((now-last)/1000,.1));last=now;if(!paused)phase=(phase+dt*40*Number($('speed').value))%48;show();requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
